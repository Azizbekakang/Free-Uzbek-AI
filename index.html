<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Llama 3 Uzbek AI Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --user-msg: #0284c7;
            --ai-msg: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #334155;
        }
        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .user-message {
            background-color: var(--user-msg);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: var(--ai-msg);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .input-container {
            padding: 15px;
            background-color: var(--card-bg);
            display: flex;
            gap: 10px;
            border-top: 1px solid #334155;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: var(--text-color);
            outline: none;
            font-size: 1rem;
        }
        input[type="text"]:focus {
            border-color: var(--accent-color);
        }
        button {
            padding: 12px 24px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover:not(:disabled) {
            background-color: #7dd3fc;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <header>
        <h1>🦙 Free Llama 3 Uzbek AI Assistant</h1>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">
            Salom! Men bepul AI-assistentman. Savolingizni yozing.
        </div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Xabaringizni yozing..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">Yuborish</button>
    </div>

    <script>
        const systemPrompt = "Siz aqlli, xushmuomala va o'zbek tilida mukammal javob beradigan AI assistentsiz. Barcha savollarga aniq va tushunarli o'zbek tilida javob bering.";

        async function sendMessage() {
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const promptText = userInput.value.trim();
            if (!promptText) return;

            sendBtn.disabled = true;
            userInput.disabled = true;

            appendMessage(promptText, 'user-message');
            userInput.value = '';

            const loadingDiv = appendMessage("O'ylamoqda...", 'ai-message');

            try {
                // 1-usul: POST (suhbat tarixi bilan yaxshi)
                let reply = await tryPost(promptText);

                // Agar POST ishlamasa → GET usuliga o'tamiz
                if (!reply) {
                    reply = await tryGet(promptText);
                }

                if (reply) {
                    loadingDiv.innerText = reply;
                } else {
                    loadingDiv.innerText = "Javob olishda xatolik. Keyinroq qayta urinib ko'ring.";
                }
            } catch (err) {
                console.error(err);
                loadingDiv.innerText = "Server bilan bog'lanishda xatolik. Internetni tekshiring yoki faylni hostingga joylashtiring (GitHub Pages, Netlify va h.k.).";
            } finally {
                sendBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        // POST usuli
        async function tryPost(prompt) {
            try {
                const res = await fetch("https://text.pollinations.ai/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: prompt }
                        ],
                        model: "openai",
                        seed: Math.floor(Math.random() * 99999)
                    })
                });
                if (!res.ok) return null;
                const text = await res.text();
                return text?.trim() || null;
            } catch {
                return null;
            }
        }

        // GET usuli (ko'pincha barqarorroq)
        async function tryGet(prompt) {
            try {
                const url = `https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai&system=${encodeURIComponent(systemPrompt)}`;
                const res = await fetch(url);
                if (!res.ok) return null;
                const text = await res.text();
                return text?.trim() || null;
            } catch {
                return null;
            }
        }

        function appendMessage(text, className) {
            const chatContainer = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
