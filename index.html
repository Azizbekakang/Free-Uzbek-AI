<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Llama 3 Uzbek AI Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --user-msg: #0284c7;
            --ai-msg: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            color: var(--accent-color);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-message {
            background-color: var(--user-msg);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            background-color: var(--ai-msg);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .input-container {
            padding: 15px;
            background-color: var(--card-bg);
            display: flex;
            gap: 10px;
            border-top: 1px solid #334155;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: var(--text-color);
            outline: none;
            font-size: 1rem;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 12px 24px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #7dd3fc;
        }
    </style>
</head>
<body>

    <header>
        <h1>🦙 Free Llama 3 Uzbek AI Assistant</h1>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">
            Salom! Men mutlaqo bepul va API kalitsiz ishlaydigan Llama 3 AI-assistentingizman. Menga istalgan savolingizni berishingiz mumkin!
        </div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Xabaringizni yozing..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Yuborish</button>
    </div>

    <script>
        async function sendMessage() {
            const userInput = document.getElementById('userInput');
            const chatContainer = document.getElementById('chatContainer');

            const promptText = userInput.value.trim();
            if (!promptText) return;

            // User xabarini chiqarish
            appendMessage(promptText, 'user-message');
            userInput.value = '';

            // AI yuklanish holati
            const loadingDiv = appendMessage("Llama 3 o'ylamoqda...", 'ai-message');

            try {
                // Hugging Face Ochiq API Serveri
                const response = await fetch("https://api-inference.huggingface.co/models/meta-llama/Llama-3.2-1B-Instruct", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        inputs: `<|begin_of_text|><|start_header_id|>system<|end_header_id|>\n\nSiz aqlli va xushmuomala AI assistentsiz. Barcha savollarga o'zbek tilida aniq va tushunarli javob bering.<|eot_id|><|start_header_id|>user<|end_header_id|>\n\n${promptText}<|eot_id|><|start_header_id|>assistant<|end_header_id|>\n\n`,
                        parameters: {
                            max_new_tokens: 512,
                            temperature: 0.7,
                            return_full_text: false
                        }
                    })
                });

                const data = await response.json();

                if (Array.isArray(data) && data[0].generated_text) {
                    loadingDiv.innerText = data[0].generated_text.trim();
                } else if (data.error) {
                    // Agar model "o'yg'onayotgan" bo'lsa (warm up)
                    if (data.error.includes("loading")) {
                        loadingDiv.innerText = "Model ishga tushmoqda, 10-15 sekunddan keyin qayta urunib ko'ring...";
                    } else {
                        loadingDiv.innerText = "Xatolik: " + data.error;
                    }
                } else {
                    loadingDiv.innerText = "Javob olishda xatolik bo'ldi.";
                }

            } catch (error) {
                console.error("Xatolik:", error);
                loadingDiv.innerText = "Server bilan bog'lanishda xatolik yuz berdi.";
            }

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessage(text, className) {
            const chatContainer = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
